schema_version: 1

context:
  version: "0.9.1"

package:
  name: pyspellchecker
  version: ${{ version }}

source:
  - url: https://files.pythonhosted.org/packages/source/p/pyspellchecker/pyspellchecker-${{ version }}.tar.gz
    sha256: 786c21f082d4059b139bca922cd6db6c85c800374b904b59a8f61d75a0a62d7f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - spellchecker
      pip_check: false
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  license: MIT
  license_file: LICENSE
  summary: Pure python spell checker based on work by Peter Norvig
  homepage: https://github.com/barrust/pyspellchecker

extra:
  recipe-maintainers:
    - dschreij
    - smathot
    - jsmolic
